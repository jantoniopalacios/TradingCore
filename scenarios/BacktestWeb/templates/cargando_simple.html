<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingCore - Cargando...</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f1216;
            background-image: radial-gradient(circle at 50% 50%, #1e242d 0%, #0f1216 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            color: #e0e6ed;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .load-card {
            background: #1a1e23;
            border: 1px solid #2d343c;
            border-radius: 14px;
        }
        .brand-logo {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: #0d6efd;
        }
        .status-icon { font-size: 2.5rem; }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">

            <div class="text-center mb-4">
                <div class="brand-logo mb-1">
                    <i class="fas fa-chart-line me-2"></i>TRADING<span class="text-light">CORE</span>
                </div>
                <p class="text-muted small">Preparando el sistema para <strong class="text-info">{{ user_mode }}</strong></p>
            </div>

            <div class="card load-card shadow-lg">
                <div class="card-body p-5 text-center">
                    <div class="status-icon text-primary mb-3">
                        <i class="fas fa-circle-notch fa-spin"></i>
                    </div>
                    <h4 class="mb-2 text-light">Cargando...</h4>
                    <p class="text-muted small">Preparando tus datos. Por favor espera.</p>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    // Redirigir al index con una transición corta configurable desde backend.
    setTimeout(function () {
        window.location.href = '{{ url_for("main.index") }}';
    }, {{ delay_ms|default(500) }});
</script>
</body>
</html>
